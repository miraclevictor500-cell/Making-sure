server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/plain text/css application/javascript;

    # The project is a folder of standalone .html practice files with no
    # index.html, so the directory listing is the site's entry point.
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }
}
